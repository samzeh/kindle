; Custom Kindle - ESP32-WROOM-32 + GDEQ0426T82-FT01C 4.26" frontlit touch e-paper
;
; The ESP-WROOM-32 has no PSRAM, so the app partition is sized to hold an
; embedded TTF and the reader streams everything else off the SD card.
;
; Two firmwares share this source tree:
;   pio run -e esp32dev -t upload    the reader
;   pio run -e bringup  -t upload    phase 0 hardware diagnostics

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino

; Books live in internal flash rather than on an SD card, so the layout trades
; the unused half of the app partition for LittleFS storage: 1.5MB app (the
; reader builds to ~1.1MB) and 2.4MB for books. The embedded font lives in
; flash .rodata and is read in place by stb_truetype, so it counts against the
; app partition.
board_build.partitions = partitions/kindle_4mb.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    -Wall
    ; miniz: keep the ZIP reader, drop everything we cannot or will not use.
    ; These must be defined globally because they change miniz.h's API surface.
    -DMINIZ_NO_STDIO
    -DMINIZ_NO_ARCHIVE_WRITING_APIS
    -DMINIZ_NO_ZLIB_APIS
    -DMINIZ_NO_TIME
build_unflags =
    -std=gnu++11

lib_deps =
    zinggjm/GxEPD2@^1.6.0
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.1

; The reader.
[env:esp32dev]
build_src_filter = +<*> -<bringup/>

; Phase 0 bring-up diagnostics: finds the SD chip select, calibrates the touch
; axes and times a panel refresh. Deliberately depends on as little of the
; reader as possible -- just the panel, the font cache and the draw helpers --
; so a failure here points at hardware rather than at reader logic.
[env:bringup]
build_src_filter =
    -<*>
    +<bringup/>
    +<hal/Display.cpp>
    +<text/FontCache.cpp>
    +<text/stb_impl.cpp>
    +<text/fonts/CharisSubset.cpp>
    +<ui/Draw.cpp>
